        namespace: auto-git-underscore-ns

  # RHACM4K-1071: private Git (mortgage path), local placement; credentials merged from env at runtime.
  auto_git_private_local:
    enabled: true
    tests:
      - RHACM4K-1071
    blocks:
      - use:
          - git_private_mortgage
