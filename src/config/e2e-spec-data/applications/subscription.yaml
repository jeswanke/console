# Subscription application create wizard. Scenario subscription fields live under `specDomains.subscription`.

profiles:
  # Wizard fill driven by merged `perBlock` from `blocks[].use` (no TS defaults for these sections).
  subscription_full_wizard:
    fillEntireWizard: true

  # Wizard exercises without submitting (typical console e2e).
  subscription_dry_run:
    submit: false
    ensureFormMode: true

  # Submit + same wizard defaults as `subscription_explicit_channels` (omit explicit_channels when you only need this).
  subscription_submit:
    fillEntireWizard: false
    submit: true
    ensureFormMode: true

  # Multi-repo flows: only fill what `blocks[].use` + perBlock define (same `perBlock`-only apply as full wizard).
  subscription_explicit_channels:
    fillEntireWizard: false
    submit: false
    ensureFormMode: true

scenarios:
  smoke_subscription:
    enabled: true
    tests:
      - RHACM4K-SMOKE-SUBSCRIPTION
    blocks:
      - use:
          - repo_samples_default
          - placement_label_local
          - timewindow_workweek_toronto
          - skip_automation_ansible
    extends:
      - subscription_full_wizard
      - subscription_dry_run
    specDomains:
      subscription:
        applicationName: e2e-spec-data-smoke-app
        namespace: e2e-spec-data-smoke-ns

  matrix_example_subscription:
    enabled: true
    tests:
      - RHACM4K-MATRIX-0001
    blocks:
      - use:
          - repo_samples_default
          - placement_label_local
          - timewindow_workweek_toronto
          - skip_automation_ansible
    extends:
      - subscription_full_wizard
      - subscription_dry_run
    specDomains:
      subscription:
        applicationName: e2e-matrix-app
        namespace: e2e-matrix-ns

  # Single Git repo (helloworld path) + label placement to local-cluster; submit + Details/Topology e2e.
  auto_git_helloworld_local:
    enabled: true
    tests:
      - RHACM4K-7484
      - RHACM4K-7487
    blocks:
      - use:
          - git_helloworld
          - skip_automation_ansible
          - placement_label_local
          - timewindow_default
    extends:
      - subscription_submit
    specDomains:
      subscription:
        applicationName: auto-git-helloworld
        namespace: auto-git-helloworld-ns

  # RHACM4K-39232: helloworld + label placement (local-cluster).
  auto_git_placement_topology:
    enabled: true
    tests:
      - RHACM4K-39232
    blocks:
      - use:
          - git_helloworld
          - skip_automation_ansible
          - placement_label_local
          - timewindow_default
    extends:
      - subscription_submit
    specDomains:
      subscription:
        applicationName: api-git-local
        namespace: api-git-local-ns

  # RHACM4K-39666: Git repo URL with underscore (`ruici-h/app_samples`); online placement.
  auto_git_underscore:
    enabled: true
    tests:
      - RHACM4K-39666
    blocks:
      - use:
          - git_underscore
          - skip_automation_ansible
          - placement_online_vendor_openshift
          - timewindow_default
    extends:
