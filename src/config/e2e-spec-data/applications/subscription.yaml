    specDomains:
      subscription:
        applicationName: auto-git-mortgage
        namespace: auto-git-mortgage-ns

  # RHACM4K-1427: subscription payload + expectations **after** edit (mortgage path, mortgage topology).
  auto_git_mortgage_edit_local:
    enabled: true
    tests:
      - RHACM4K-1427
    blocks:
      - use:
          - git_mortgage
