          - git_helloworld
          - skip_automation_ansible
          - placement_label_local
          - timewindow_default
      - use:
          - git_mortgage
          - skip_automation_ansible
          - placement_label_local
          - timewindow_default
    extends:
      - subscription_submit
    specDomains:
      subscription:
        applicationName: auto-git-multi
        namespace: auto-git-multi-ns

  # RHACM4K-1558: delete Application CR only (subscriptions/channels remain in Advanced; Placement CRs via oc).
  auto_git_multi_delete:
    enabled: true
    tests:
      - RHACM4K-1558
