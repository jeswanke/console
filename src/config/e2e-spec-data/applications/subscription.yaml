    specDomains:
      subscription:
        applicationName: auto-git-private
        namespace: auto-git-private-ns

  # Baseline for RHACM4K-1427: same app/namespace as edit scenario, but **helloworld** repo (create wizard).
  # The test then edits block 0 to **mortgage** via `auto_git_mortgage_edit_local` payload.
  auto_git_mortgage_edit_base:
    enabled: true
    blocks:
      - use:
          - git_helloworld
          - skip_automation_ansible
          - placement_label_local
          - timewindow_default
