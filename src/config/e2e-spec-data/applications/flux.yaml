# Flux CD applications (`specDomains.flux`).
# Cypress: `Flux_Application_Local_Test_Suite.cy.js`, `Flux_Application_Managed_Test_Suite.cy.js`.
# Managed scenarios omit `clusterName`; specs inject it from `E2E_MANAGED_CLUSTER_NAME` / managedClusters.json.

version: 1

fragments:
  flux_local_cluster:
    clusterName: local-cluster

  flux_git_helloworld_deploy:
    deployment: helloworld-app-deploy
    service: helloworld-app-svc
    route: helloworld-app-route
    successNumber: 6
    topologyIcons:
      - route
      - service
      - replicaset
      - customresource

  flux_helm_helloworld_deploy:
    deployment: helloworld-app-deploy
    service: helloworld-app-svc
    route: helloworld-app-route
    successNumber: 6
    topologyIcons:
      - route
      - service
      - replicaset
      - customresource
      - chart

  flux_git_mortgage_deploy:
    deployment: mortgage-app-deploy
    service: mortgage-app-svc
    successNumber: 5
    topologyIcons:
      - service
      - replicaset
      - customresource

  flux_helm_mortgage_deploy:
    deployment: mortgage-app-deploy
    service: mortgage-app-svc
    successNumber: 5
    topologyIcons:
      - service
      - replicaset
      - customresource
      - chart

profiles:
  flux_git_app:
    specDomains:
      flux:
        kind: git
        gitAppTemplateRelativePath: src/templates/app/flux/flux-git-template.yaml

  flux_helm_app:
    specDomains:
      flux:
        kind: helm
        helmAppTemplateRelativePath: src/templates/app/flux/flux-helm-template.yaml

scenarios:
  flux_git_local_16762:
    enabled: true
    tests:
      - RHACM4K-16762
    blocks:
      - use:
          - flux_local_cluster
          - flux_git_helloworld_deploy
    extends:
      - flux_git_app
    specDomains:
      flux:
        applicationName: auto-flux-git-local
        namespace: auto-flux-git-local-ns
        git:
          path: helloworld

  flux_helm_local_16763:
    enabled: true
    tests:
      - RHACM4K-16763
    blocks:
      - use:
          - flux_local_cluster
          - flux_helm_helloworld_deploy
    extends:
      - flux_helm_app
    specDomains:
      flux:
        applicationName: auto-flux-helm-local
        namespace: auto-flux-helm-local-ns
        helm:
          chartName: helloworld-helm
          packageVersion: "0.2.0"

  flux_git_edit_local_initial:
    enabled: true
    blocks:
