## Batch 1 — export_csv (RHACM4K-52041 through RHACM4K-52044)
## 2 policies + 1 PolicySet + Placement + PlacementBinding.
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: settest-ns-spec-exportcsv-e2e
  namespace: default
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.IP Information Protection Processes and Procedures
    policy.open-cluster-management.io/controls: PR.IP-1 Baseline Configuration
    policy.open-cluster-management.io/description: Policyset to test export CSV feature
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ns-spec-prod-ns-exportcsv-e2e
        spec:
          remediationAction: inform
          severity: low
          namespaceSelector:
            exclude:
              - kube-*
            include:
              - default
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: Namespace
                apiVersion: v1
                metadata:
                  name: prod-exportcsv-e2e
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: settest-policy-certpolicy-exportcsv-e2e
  namespace: default
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS Data Security
    policy.open-cluster-management.io/controls: PR.DS-2 Data-in-transit
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: CertificatePolicy
        metadata:
          name: settest-policy-certpolicy-exportcsv-e2e
        spec:
          namespaceSelector:
            include:
              - default
            exclude:
              - kube-*
          remediationAction: inform
          severity: low
          minimumDuration: 30h
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: test-policyset-1-exportcsv-e2e
  namespace: default
spec:
  policies:
    - settest-ns-spec-exportcsv-e2e
    - settest-policy-certpolicy-exportcsv-e2e
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: test-policyset-pb-1-exportcsv-e2e
  namespace: default
placementRef:
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
  name: test-policyset-plr-1-exportcsv-e2e
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: PolicySet
    name: test-policyset-1-exportcsv-e2e
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: test-policyset-plr-1-exportcsv-e2e
  namespace: default
spec:
  clusterSets:
    - default
  numberOfClusters: 1
