apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: plc-auto-ansicred-[ID]-[TESTID]
  namespace: default
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.IP Information Protection Processes and Procedures
    policy.open-cluster-management.io/controls: PR.IP-1 Baseline Configuration
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-automation-cred-[ID]-[TESTID]
        spec:
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grcui-e2e-credential
                  namespace: default
                  labels:
                    cluster.open-cluster-management.io/credentials: ''
                    cluster.open-cluster-management.io/type: ans
                data:
                  host: >
                    {{ (printf "https://%s" (lookup "route.openshift.io/v1" "Route" "aap" "aap").spec.host) | base64enc }}
                  token: '{{ (fromSecret "aap" "aap-gateway-oauth2-token-secret" "token") }}'
                type: Opaque
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-plc-auto-ansicred-[ID]-[TESTID]
  namespace: default
placementRef:
  name: plc-auto-ansicred-[ID]-[TESTID]-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: plc-auto-ansicred-[ID]-[TESTID]
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: plc-auto-ansicred-[ID]-[TESTID]-placement
  namespace: default
spec:
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: local-cluster
              operator: In
              values:
                - 'true'
