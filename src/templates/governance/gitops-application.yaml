apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: '[APPLICATIONNAME]'
  namespace: default
spec:
  componentKinds:
    - group: apps.open-cluster-management.io
      kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - '[APPLICATIONNAME]'
---
apiVersion: v1
kind: Namespace
metadata:
  name: ggithubcom-stolostron-grc-e2e-policy-generator-tes-ns
---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  annotations:
    apps.open-cluster-management.io/reconcile-rate: medium
  name: ggithubcom-stolostron-grc-e2e-policy-generator-tes
  namespace: ggithubcom-stolostron-grc-e2e-policy-generator-tes-ns
spec:
  type: Git
  pathname: '[URL]'
---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
    apps.open-cluster-management.io/git-branch: '[BRANCH]'
    apps.open-cluster-management.io/git-path: '[PATH]'
    apps.open-cluster-management.io/reconcile-option: merge
  labels:
    app: '[APPLICATIONNAME]'
  name: '[APPLICATIONNAME]-subscription-1'
  namespace: default
spec:
  channel: ggithubcom-stolostron-grc-e2e-policy-generator-tes-ns/ggithubcom-stolostron-grc-e2e-policy-generator-tes
  placement:
    placementRef:
      kind: Placement
      name: '[APPLICATIONNAME]-placement-1'
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: '[APPLICATIONNAME]'
  name: '[APPLICATIONNAME]-placement-1'
  namespace: default
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'local-cluster'
              operator: 'In'
              values:
                - 'true'
  clusterSets:
    - global
