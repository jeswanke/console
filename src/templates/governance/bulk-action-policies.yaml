## Batch 2 — check_bulk_action (RHACM4K-6905)
## 3 ConfigurationPolicy resources for bulk action testing.
## All target local-cluster, inform, enabled.
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: test-bulk-action-1-e2e
  namespace: default
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.IP Information Protection Processes and Procedures
    policy.open-cluster-management.io/controls: PR.IP-1 Baseline Configuration
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-pod-bulk-1-e2e
        spec:
          remediationAction: inform
          severity: low
          namespaceSelector:
            exclude:
              - kube-*
            include:
              - default
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Pod
                metadata:
                  name: nginx-pod-bulk-1-e2e
                spec:
                  securityContext:
                    runAsNonRoot: true
                  containers:
                    - name: nginx
                      image: registry.access.redhat.com/ubi9/nginx-124:latest
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop:
                            - ALL
                      resources:
                        limits:
                          cpu: 100m
                          memory: 128Mi
                        requests:
                          cpu: 50m
                          memory: 64Mi
