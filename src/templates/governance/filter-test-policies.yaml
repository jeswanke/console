## Batch 1 — check_filter (RHACM4K-6818)
## 3 policies placed on local-cluster with inform remediation.
## All enabled, local, inform. Will have violations (pod does not exist).
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: test-bulk-action-1-e2e
  namespace: default
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.IP Information Protection Processes and Procedures
    policy.open-cluster-management.io/controls: PR.IP-1 Baseline Configuration
spec:
  disabled: false
  remediationAction: inform
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: filter-test-pod-1-e2e
        spec:
          remediationAction: inform
          severity: low
          namespaceSelector:
            include:
              - default
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Pod
                metadata:
                  name: nginx-filter-test-1-e2e
                spec:
                  securityContext:
                    runAsNonRoot: true
                  containers:
                    - name: nginx
                      image: nginx:latest
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop:
                            - ALL
                      resources:
                        limits:
                          cpu: 100m
                          memory: 128Mi
                        requests:
                          cpu: 50m
                          memory: 64Mi
---
