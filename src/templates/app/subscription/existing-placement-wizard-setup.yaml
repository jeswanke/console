apiVersion: v1
kind: Namespace
metadata:
  name: placement-test-ns
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: placement-test
  name: placement-test-placement-1
  namespace: placement-test-ns
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'In'
              values:
                - 'local-cluster'
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: placement-test-ns
  name: global
spec:
  clusterSet: global
---
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: test-legacy-placementrule
  namespace: placement-test-ns
spec:
  clusterSelector:
    matchLabels:
      'name': 'local-cluster'
