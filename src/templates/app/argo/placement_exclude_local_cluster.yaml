apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {APP_SET_NAME}-placement
  namespace: {APP_SET_NAMESPACE}
spec:
  clusterSets:
    - auto-gitops-cluster-set
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'NotIn'
              values:
                - 'local-cluster'
