apiVersion: v1                    
kind: Namespace
metadata:
  name: api-helm-helloworld-ns                             
---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: api-helm-helloworld
  namespace: api-helm-helloworld-ns
spec:
  componentKinds:
  - group: apps.open-cluster-management.io
    kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - api-helm-helloworld
---
apiVersion: v1                      
kind: Namespace
metadata:
  name: hcontentcom-stolostron-application-lifecycle-samples-main-ns
---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  annotations:
    apps.open-cluster-management.io/reconcile-rate: medium
  name: hcontentcom-stolostron-application-lifecycle-samples-main
  namespace: hcontentcom-stolostron-application-lifecycle-samples-main-ns
spec:
  type: HelmRepo
  pathname: 'https://raw.githubusercontent.com/stolostron/application-lifecycle-samples/main'
---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
  labels:
    app: api-helm-helloworld
  name: api-helm-helloworld-subscription-1
  namespace: api-helm-helloworld-ns
spec:
  channel: hcontentcom-stolostron-application-lifecycle-samples-main-ns/hcontentcom-stolostron-application-lifecycle-samples-main
  name: helloworld-helm
  packageOverrides:
  - packageName: helloworld-helm
    packageAlias: helloworld-helm
  packageFilter:
    version: "0.2.0"
  placement:
    placementRef:
      kind: Placement
      name: api-helm-helloworld-placement-1
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: api-helm-helloworld
  name: api-helm-helloworld-placement-1
  namespace: api-helm-helloworld-ns
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'In'
              values: 
                - {CLUSTER_NAME}
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: api-helm-helloworld-ns
  name: global
spec:
  clusterSet: global