apiVersion: v1                    
kind: Namespace
metadata:
  name: ch-object-dev-bad
---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  name: object-dev
  namespace: ch-object-dev-bad
spec:
  type: ObjectBucket
  pathname: <API_ROUTE>
  secretRef:
    name: secret-dev
  configMapRef:
    name: obj-ca
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-dev
  namespace: ch-object-dev-bad
data:
  AccessKeyID: <CONSOLE_ACCESS_KEY>
  SecretAccessKey: <CONSOLE_SECRET_KEY>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obj-ca
  namespace: ch-object-dev-bad
data:
  caCerts: |
    # minio root CA

    -----BEGIN CERTIFICATE-----
    BADCERT==
    -----END CERTIFICATE-----
---
apiVersion: v1                    
kind: Namespace
metadata:
  name: obj-tls-bad-cert-ns                             
---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: obj-tls-bad-cert
  namespace: obj-tls-bad-cert-ns
spec:
  componentKinds:
  - group: apps.open-cluster-management.io
    kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - obj-tls-bad-cert
---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
    apps.open-cluster-management.io/bucket-path: ''
  labels:
    app: obj-tls-bad-cert
  name: obj-tls-bad-cert-subscription-1
  namespace: obj-tls-bad-cert-ns
spec:
  channel: ch-object-dev-bad/object-dev
  placement:
    placementRef:
      kind: Placement
      name: obj-tls-bad-cert-placement-1
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: obj-tls-bad-cert
  name: obj-tls-bad-cert-placement-1
  namespace: obj-tls-bad-cert-ns
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'In'
              values: 
                - 'local-cluster'
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: obj-tls-bad-cert-ns
  name: global
spec:
  clusterSet: global