apiVersion: v1                    
kind: Namespace
metadata:
  name: obj-tls-test-ns                             
---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: obj-tls-test
  namespace: obj-tls-test-ns
spec:
  componentKinds:
  - group: apps.open-cluster-management.io
    kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - obj-tls-test
---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
    apps.open-cluster-management.io/bucket-path: ''
  labels:
    app: obj-tls-test
  name: obj-tls-test-subscription-1
  namespace: obj-tls-test-ns
spec:
  channel: ch-object-dev-new/object-dev
  placement:
    placementRef:
      kind: Placement
      name: obj-tls-test-placement-1
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: obj-tls-test
  name: obj-tls-test-placement-1
  namespace: obj-tls-test-ns
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'In'
              values: 
                - 'local-cluster'
                - '<Managed Cluster Name>'
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: obj-tls-test-ns
  name: global
spec:
  clusterSet: global