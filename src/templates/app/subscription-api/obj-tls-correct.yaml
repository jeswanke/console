apiVersion: v1                    
kind: Namespace
metadata:
  name: ch-object-dev-new
---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  name: object-dev
  namespace: ch-object-dev-new
spec:
  type: ObjectBucket
  pathname: <API_ROUTE>
  secretRef:
    name: secret-dev
  configMapRef:
    name: obj-ca
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-dev
  namespace: ch-object-dev-new
data:
  AccessKeyID: <CONSOLE_ACCESS_KEY>
  SecretAccessKey: <CONSOLE_SECRET_KEY>
