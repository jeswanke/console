apiVersion: v1                    
kind: Namespace
metadata:
  name: api-obj-multi-ns                             
---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: api-obj-multi
  namespace: api-obj-multi-ns
spec:
  componentKinds:
  - group: apps.open-cluster-management.io
    kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - api-obj-multi
---
apiVersion: v1                      
kind: Namespace
metadata:
  name: oinioappshivemind-bawsred-chesterfieldcom-alc-qe-bucket-2-ns
---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  name: oinioappshivemind-bawsred-chesterfieldcom-alc-qe-bucket-2
  namespace: oinioappshivemind-bawsred-chesterfieldcom-alc-qe-bucket-2-ns
spec:
  type: ObjectBucket
  pathname: 'http://minio-minio.apps.hivemind-b.aws.red-chesterfield.com/alc-qe-bucket-2'
  secretRef:
    name: oinioappshivemind-bawsred-chesterfieldcom-alc-qe-bucket-2-auth
---
apiVersion: v1
kind: Secret
metadata:
  name: oinioappshivemind-bawsred-chesterfieldcom-alc-qe-bucket-2-auth
  namespace: oinioappshivemind-bawsred-chesterfieldcom-alc-qe-bucket-2-ns
data:
  AccessKeyID: {ACCESS_KEY}
  SecretAccessKey: {SECRET_KEY}
---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
    apps.open-cluster-management.io/bucket-path: 'helloworld'
  labels:
    app: api-obj-multi
  name: api-obj-multi-subscription-1
  namespace: api-obj-multi-ns
spec:
  channel: oinioappshivemind-bawsred-chesterfieldcom-alc-qe-bucket-2-ns/oinioappshivemind-bawsred-chesterfieldcom-alc-qe-bucket-2
  placement:
    placementRef:
      kind: Placement
      name: api-obj-multi-placement-1
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: api-obj-multi
  name: api-obj-multi-placement-1
  namespace: api-obj-multi-ns
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'In'
              values: 
                - {CLUSTER_NAME}
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: api-obj-multi-ns
  name: global
spec:
  clusterSet: global
---
