apiVersion: v1                    
kind: Namespace
metadata:
  name: obj-kustomize-app-ns                             
---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: obj-kustomize-app
  namespace: obj-kustomize-app-ns
spec:
  componentKinds:
  - group: apps.open-cluster-management.io
    kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - obj-kustomize-app
---
apiVersion: v1                    
kind: Namespace
metadata:
  name: opshivemind-bawsred-chesterfieldcom-alc-kustomization-app-ns
---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  name: opshivemind-bawsred-chesterfieldcom-alc-kustomization-app
  namespace: opshivemind-bawsred-chesterfieldcom-alc-kustomization-app-ns
spec:
  type: ObjectBucket
  pathname: '{OBJECTSTORE_PATHNAME}'
  secretRef:
    name: opshivemind-bawsred-chesterfieldcom-alc-kustomization-app-auth
---
apiVersion: v1
kind: Secret
metadata:
  name: opshivemind-bawsred-chesterfieldcom-alc-kustomization-app-auth
  namespace: opshivemind-bawsred-chesterfieldcom-alc-kustomization-app-ns
data:
  AccessKeyID: {ACCESS_KEY}
  SecretAccessKey: {SECRET_KEY}
---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
    apps.open-cluster-management.io/bucket-path: ''
  labels:
    app: obj-kustomize-app
  name: obj-kustomize-app-subscription-1
  namespace: obj-kustomize-app-ns
spec:
  channel: opshivemind-bawsred-chesterfieldcom-alc-kustomization-app-ns/opshivemind-bawsred-chesterfieldcom-alc-kustomization-app
  placement:
    placementRef:
      kind: Placement
      name: obj-kustomize-app-placement-1
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: obj-kustomize-app
  name: obj-kustomize-app-placement-1
  namespace: obj-kustomize-app-ns
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'In'
              values: 
                - 'local-cluster'
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: obj-kustomize-app-ns
  name: global
spec:
  clusterSet: global