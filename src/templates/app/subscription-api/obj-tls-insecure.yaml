apiVersion: v1                    
kind: Namespace
metadata:
  name: ch-object-dev-2
---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  name: object-dev
  namespace: ch-object-dev-2
spec:
  type: ObjectBucket
  pathname: <API_ROUTE>
  secretRef:
    name: secret-dev
  insecureSkipVerify: true
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-dev
  namespace: ch-object-dev-2
data:
  AccessKeyID: <CONSOLE_ACCESS_KEY>
  SecretAccessKey: <CONSOLE_SECRET_KEY>
---
apiVersion: v1                    
kind: Namespace
metadata:
  name: obj-insecure-test-ns                             
---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: obj-insecure-test
  namespace: obj-insecure-test-ns
spec:
  componentKinds:
  - group: apps.open-cluster-management.io
    kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - obj-insecure-test
---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
    apps.open-cluster-management.io/bucket-path: ''
  labels:
    app: obj-insecure-test
  name: obj-insecure-test-subscription-1
  namespace: obj-insecure-test-ns
spec:
  channel: ch-object-dev-2/object-dev
  placement:
    placementRef:
      kind: Placement
      name: obj-insecure-test-placement-1
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: obj-insecure-test
  name: obj-insecure-test-placement-1
  namespace: obj-insecure-test-ns
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'In'
              values: 
                - 'local-cluster'
                - '<Managed Cluster Name>'
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: obj-insecure-test-ns
  name: global
spec:
  clusterSet: global