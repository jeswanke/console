apiVersion: v1                    
kind: Namespace
metadata:
  name: {APP_NAMESPACE}                             
---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {APP_NAME}
  namespace: {APP_NAMESPACE}
spec:
  componentKinds:
  - group: apps.open-cluster-management.io
    kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: 
          - {APP_NAME}
---
apiVersion: v1                      
kind: Namespace
metadata:
  name: hcontentcom-stolostron-application-lifecycle-samples-main-ns
---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  annotations:
    apps.open-cluster-management.io/reconcile-rate: medium
  name: hcontentcom-stolostron-application-lifecycle-samples-main
  namespace: hcontentcom-stolostron-application-lifecycle-samples-main-ns
spec:
  type: HelmRepo
  pathname: '{APP_URL}'
---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
  labels:
    app: {APP_NAME}
  name: {APP_NAME}-subscription-1
  namespace: {APP_NAMESPACE}
spec:
  channel: hcontentcom-stolostron-application-lifecycle-samples-main-ns/hcontentcom-stolostron-application-lifecycle-samples-main
  name: {APP_CHART_NAME}
  packageOverrides:
  - packageName: {APP_CHART_NAME}
    packageAlias: {APP_CHART_NAME}
  packageFilter:
    version: "{APP_PACKAGE_VERSION}"
  placement:
    placementRef:
      kind: Placement
      name: {APP_NAME}-placement-1
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
    app: {APP_NAME}
  name: {APP_NAME}-placement-1
  namespace: {APP_NAMESPACE}
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: In
              values: ['{CLUSTER_NAME}']
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: {APP_NAMESPACE}
  name: global
spec:
  clusterSet: global

