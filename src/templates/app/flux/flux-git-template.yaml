apiVersion: v1
kind: Namespace
metadata:
  name: {APP_NAMESPACE}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {APP_NAME}
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./{APP_PATH}
  prune: true
  sourceRef:
    kind: GitRepository
    name: app-samples
  targetNamespace: {APP_NAMESPACE}