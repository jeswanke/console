# Runs ESLint + Prettier; posts a PR comment when lint fails.
#
# Security model (pull_request_target):
#   - Workflow definition always comes from the base branch (trusted).
#   - PR code is checked out into an isolated `pr-code/` directory (untrusted).
#   - Trusted scripts (.github/scripts/) are checked out separately from the base branch
#     so a malicious PR cannot tamper with code that handles GITHUB_TOKEN.
#   - npm ci uses --ignore-scripts to block malicious lifecycle hooks.
#   - GITHUB_TOKEN is only exposed to the trusted lint_and_comment.py script.
name: Lint Check

on:
  pull_request_target:
    branches: ['**']
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout base branch (trusted scripts)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: trusted
          persist-credentials: false

      - name: Checkout PR head (untrusted, supports private forks)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr-code
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'pr-code/package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: pr-code

      - name: Install Python dependencies
        run: pip install PyGithub

      - name: Run Lint and Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_ROOT: ${{ github.workspace }}/pr-code
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python ${{ github.workspace }}/trusted/.github/scripts/lint_and_comment.py
