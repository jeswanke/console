# Runs ESLint + Prettier; posts a PR comment when lint fails (same pattern as clc-ui-e2e).
#
# Uses pull_request_target so GITHUB_TOKEN can comment on PRs from forks. The workflow
# definition always comes from the base branch; we checkout the PR head (including forks).
# npm ci uses --ignore-scripts to reduce risk from malicious lifecycle hooks (see GitHub
# security docs on pull_request_target).
name: Lint Check

on:
  pull_request_target:
    branches: ['**']
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout PR head (supports forks)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: ${{ github.workspace }}

      - name: Install Python dependencies
        run: pip install PyGithub

      - name: Run Lint and Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_ROOT: ${{ github.workspace }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python ${{ github.workspace }}/.github/scripts/lint_and_comment.py
