apiVersion: v1
kind: Namespace
metadata:
  name: install-mc-ops-policy-ns
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  labels:
  name: exclude-local-placement
  namespace: install-mc-ops-policy-ns
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'name'
              operator: 'NotIn'
              values:
                - 'local-cluster'
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  namespace: install-mc-ops-policy-ns
  name: global
spec:
  clusterSet: global
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: install-mc-ops-policy
  namespace: install-mc-ops-policy-ns
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: create-ns-policy-1
        spec:
          remediationAction: inform
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: Namespace
                apiVersion: v1
                metadata:
                  name: flux-system
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: create-operatorgroup-policy-1
        spec:
          remediationAction: inform
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: OperatorGroup
                apiVersion: operators.coreos.com/v1
                metadata:
                  name: flux
                  namespace: flux-system
                spec:
                  upgradeStrategy: Default
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: create-operator-sub-policy-1
        spec:
          remediationAction: inform
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: flux
                  namespace: flux-system
                spec:
                  channel: stable
                  installPlanApproval: Automatic
                  name: flux
                  source: community-operators
                  sourceNamespace: openshift-marketplace
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-install-mc-ops-policy
  namespace: install-mc-ops-policy-ns
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: exclude-local-placement
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: install-mc-ops-policy
