# oc create configmap glauth-config --from-file=glauth.cfg -n qe-ldap
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"
  tls = false

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=qe-ldap,dc=internal"
  nameformat = "cn"
  groupformat = "ou"

