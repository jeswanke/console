apiVersion: v1
kind: ServiceAccount
metadata:
  name: ldap-group-syncer
  namespace: qe-ldap

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ldap-group-sync-role
rules:
- apiGroups:
  - user.openshift.io
  resources:
  - groups
  - users
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ldap-group-syncer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ldap-group-sync-role
subjects:
- kind: ServiceAccount
  name: ldap-group-syncer
  namespace: qe-ldap